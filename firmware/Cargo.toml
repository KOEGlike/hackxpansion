[workspace]
resolver = "2"
members = ["xpanse", "xpanse-api", "drivers/test-driver", "apps/button-logger", "apps/neon-beat", "apps/nes-emulator"]

[profile.release]
debug = 2

[workspace.dependencies]
xpanse-api = { path = "./xpanse-api/" }

embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rp235xb",
  "binary-info",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "icmp",
  "tcp",
  "udp",
  "raw",
  "dhcpv4",
  "medium-ethernet",
  "dns",
] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-usb-logger = { version = "0.6.0" }

defmt = "1.1"
defmt-rtt = "1.0.0"
fixed = "1.29"
fixed-macro = "1.2"

serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde-json-core = "0.6"

# for assign resources example
assign-resources = "0.5.0"

cortex-m = { version = "0.7.6", features = ["critical-section", "inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
display-interface-spi = "0.5.0"
embedded-graphics = { version = "0.8.2", features = ["defmt"] }
slint = { version = "1.17", default-features = false, features = [
  "compat-1-2",
  "unsafe-single-threaded",
  "libm",
  "renderer-software",
] }
slint-build = "1.17"
rgb = "0.8.51"
mipidsi = "0.10.0"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.0", default-features = false }
smart-leds = "0.4.0"
heapless = "0.9"
libm = "0.2"
usbd-hid = "0.10.0"
ti-adc-expander = { version = "0.1", features = ["defmt"] }

embedded-hal = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-storage = { version = "0.3" }
embedded-alloc = "0.7.0"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
log = "0.4"
embedded-sdmmc = "0.9.0"

pio = "0.3"

# Drivers
test-driver = { path = "./drivers/test-driver/" }
two-button-driver = { path = "./drivers/two-button-driver/" }
four-button-driver = { path = "./drivers/four-button-driver/" }

# Apps
button-logger = { path = "./apps/button-logger/" }
cube-game = { path = "./apps/cube-game/" }
neon-beat = { path = "./apps/neon-beat/" }
snake-game = { path = "./apps/snake-game/" }
nes-emulator = { path = "./apps/nes-emulator/" }
